{% extends "admin/core/base.html" %}

{% block title %}
    {{ title }}
{% endblock title %}

{% block title-section %}
    {{ title }}
{% endblock title-section %}

{% block title-sub %}
    Abstract Indexing
{% endblock title-sub %}

{% block body %}

<div class="row expanded">

    <div class="large-8 columns">

        <div class="box">

            <div class="content">

                <form
                    method="post"
                    enctype="multipart/form-data"
                >

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="success button"
                    >
                        Save
                    </button>

                    <a
                        href="{% url 'abstract_indexing_config' %}"
                        class="button secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock body %}

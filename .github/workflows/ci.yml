name: Crossref Fixture Verification

on:
  pull_request:
    branches: [main]

jobs:
  verify-crossref:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source without SSH
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout submission_proof
        uses: actions/checkout@v4
        with:
          repository: Nadia1gh/janeway-author-submission-proof
          ref: 8092a0c4ab274a15b0f7c7a4e84338ab6f437496
          path: src/plugins/submission_proof
          persist-credentials: false
      - name: Prepare submission_proof
        shell: bash
        run: |
          cp -a src/plugins/submission_proof/src/plugins/submission_proof/. src/plugins/submission_proof/
          test -f src/plugins/submission_proof/plugin_settings.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --src lib/ -r requirements.txt -r dev-requirements.txt
      - name: Verify syntax and Ruff formatting
        run: |
          python -m py_compile src/identifiers/tests/test_logic.py
          ruff format --check src/identifiers/tests/test_logic.py
      - name: Run Crossref identifier tests
        env:
          DB_VENDOR: sqlite
          DB_NAME: ":memory:"
          JANEWAY_SETTINGS_MODULE: core.janeway_global_settings
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python src/manage.py test identifiers.tests.test_logic --noinput
      - name: Full Django regression suite
        continue-on-error: true
        env:
          DB_VENDOR: sqlite
          DB_NAME: ":memory:"
          JANEWAY_SETTINGS_MODULE: core.janeway_global_settings
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python src/manage.py test --noinput

name: Active Role Authorization Verification

on:
  pull_request:
    branches: [main]

jobs:
  verify-active-role:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source without SSH
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Checkout submission_proof
        uses: actions/checkout@v4
        with:
          repository: Nadia1gh/janeway-author-submission-proof
          ref: 8092a0c4ab274a15b0f7c7a4e84338ab6f437496
          path: src/plugins/submission_proof
          persist-credentials: false
      - name: Prepare submission_proof
        shell: bash
        run: |
          cp -a src/plugins/submission_proof/src/plugins/submission_proof/. src/plugins/submission_proof/
          test -f src/plugins/submission_proof/plugin_settings.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --src lib/ -r requirements.txt -r dev-requirements.txt
      - name: Python syntax check
        run: |
          python -m compileall -q src/core/models.py src/core/tests/test_active_role_authorization.py src/security/decorators.py src/security/logic.py src/submission/models.py src/submission/decorators.py src/submission/views.py
      - name: Verify Ruff formatting
        run: |
          ruff format --check src/core/models.py src/core/templatetags/roles.py src/core/tests/test_active_role_authorization.py src/security/decorators.py src/security/logic.py src/submission/decorators.py src/submission/models.py src/submission/views.py
      - name: Django active role and security tests
        env:
          DB_VENDOR: sqlite
          DB_NAME: ":memory:"
          JANEWAY_SETTINGS_MODULE: core.janeway_global_settings
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python src/manage.py test core.tests.test_active_role_authorization security.test_security.TestSecurity.test_section_editor_cant_access_view_because_of_pii security.test_security.TestSecurity.test_section_editor_cannot_see_pii_when_enabled security.test_security.TestSecurity.test_file_edit_user_required_allows_access_to_owners_to_private_files security.test_security.TestSecurity.test_file_user_required_allows_access_to_owners_to_private_files security.test_security.TestSecurity.test_proofreader_for_article_required_with_author_proofreader --noinput
